name: Update-Readmes

on:
  workflow_dispatch:
  push:

concurrency:
  group: readme-${{ github.repository }}
  cancel-in-progress: false

jobs:
  Update-Readmes:
    runs-on: ubuntu-latest
    steps:

      - name: Check Out Auto Readme Repo
        uses: actions/checkout@v6
        with:
          repository: Kometa-Team/People-Auto-Readme

      - name: Check Out Images Repo
        uses: actions/checkout@v6
        with:
          path: imagerepo
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            README.md
            */README.md

      - name: Prepare Readme Input Tree
        run: |
          git -C imagerepo ls-tree -r --name-only HEAD > image-paths.txt
          mkdir readmeinput
          python - <<'PY'
          from pathlib import Path
          root = Path("readmeinput")
          for line in Path("image-paths.txt").read_text(encoding="utf-8").splitlines():
              lower = line.lower()
              if "/images/" not in lower:
                  continue
              if not lower.endswith((".jpg", ".jpeg", ".png")):
                  continue
              path = root / line
              path.parent.mkdir(parents=True, exist_ok=True)
              path.touch()
          PY

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Readmes
        run: python auto_readme.py -s "rainier" -d "readmeinput"

      - name: Copy Generated Readmes
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("readmeinput")
          dst = Path("imagerepo")
          for path in src.rglob("README.md"):
              target = dst / path.relative_to(src)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(path.read_bytes())
          PY

      - name: Check Diff
        id: verify_diff
        working-directory: ./imagerepo
        run: |
          git add README.md */README.md
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Changes
        if: steps.verify_diff.outputs.changed == 'true'
        working-directory: ./imagerepo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Readme Update"
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              if git push origin HEAD:master; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep 10
          done
          exit 1

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }}: ${{ vars.TEXT_COPYRIGHT }}"
          url: https://github.com/Kometa-Team/${{ vars.NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}
